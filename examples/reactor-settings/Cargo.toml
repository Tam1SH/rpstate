[package]
name = "amethystate-reactor-settings-example"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.95.0"

[workspace]

[dependencies]
amethystate = "0.10.0"
amethystate-reactor = { path = "../../crates/adapters/amethystate-reactor" }
windows-reactor = "0.0.0"

[build-dependencies]
windows-reactor-setup = "0.100.0"

# Both reactor crates are placeholders on crates.io; point them at a
# windows-rs checkout.
[patch.crates-io]
windows-reactor = { path = "../../../windows-rs/crates/libs/reactor" }
windows-reactor-setup = { path = "../../../windows-rs/crates/libs/reactor-setup" }

[profile.release]
panic = "abort"
