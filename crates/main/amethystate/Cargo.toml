[package]
name = "amethystate"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[features]
default = ["redb"]
json = ["text"]
toml = ["dep:toml_edit", "text"]
ron = ["dep:ron", "text"]
sqlite = ["dep:rusqlite", "dep:sonic-rs", "dep:parking_lot"]
sqlite-bundled = ["sqlite", "rusqlite/bundled"]
redb = ["dep:redb", "dep:rmp-serde", "dep:parking_lot", "dep:arc-swap"]
text = ["dep:tempfile", "dep:parking_lot", "dep:notify"]

async = ["amethystate-core/async"]
tauri = ["amethystate-macros/tauri", "amethystate-tauri", "async"]

confy-compat-0-6 = ["dep:directories"]
confy-compat = []
test-utils = ["amethystate-core/test-utils"]

# Counts every allocation in the profiling example and attributes it to where
# it was made. Off by default because it replaces the global allocator and
# records a backtrace per allocation, which makes any timing meaningless.
dhat-heap = []

# Opens `store::backend::utils` so a bench can reach it. A bench is a separate
# crate and cannot see a private module; none of what this exposes is API.
bench-internals = []

# The macro goldens: trybuild and macrotest, which compile a crate per case
# and cost more than the rest of the suite put together. Off by default so an
# ordinary run stays quick; CI turns it on, which is what keeps the goldens
# from rotting.
golden = []


[dependencies]
erased-serde.workspace = true
rayon = { workspace = true }
rusqlite = { version = "0.39.0", optional = true }
sonic-rs = { version = "0.5.8", optional = true }
uuid = { workspace = true, features = ["v4"] }
amethystate-core = { workspace = true }
amethystate-tauri = { workspace = true, optional = true }
petgraph = { workspace = true }
amethystate-macros = { workspace = true }
serde = { workspace = true }
error-stack = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
redb = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["preserve_order"] }
directories = { workspace = true, optional = true }
inventory = { workspace = true }
futures-core = { workspace = true }
parking_lot = { workspace = true, optional = true }
toml_edit = { version = "0.25.12", features = ["serde"], optional = true }
tempfile = { workspace = true, optional = true }
ron = { version = "0.12.1", optional = true }
notify = { version = "8", optional = true }
etcetera = "0.11.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = [ "v4", "js", "serde"] }

[dev-dependencies]
insta.workspace = true
serde_json = { workspace = true }
amethystate-core = { workspace = true, features = ["test-utils"] }
criterion = { workspace = true }
futures = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
macrotest = { workspace = true }
serde = { workspace = true }
trybuild = { workspace = true }
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
real-confy = { package = "confy", version = "2.0.0" }
serial_test = "3.5.0"
dashmap = { workspace = true }
smol_str = { workspace = true }
rmp-serde = { workspace = true }
dhat = "0.3"

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "cell_dispatch_bench"
harness = false

[[bench]]
name = "reactive_map_bench"
harness = false

[[bench]]
name = "signal_arc_bench"
harness = false

[[bench]]
name = "map_cache_shape"
harness = false

[[bench]]
name = "scan_merge_bench"
harness = false
required-features = ["bench-internals", "redb"]
