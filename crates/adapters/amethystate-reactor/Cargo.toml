[workspace]

[package]
name = "amethystate-reactor"
version = "0.1.0"
publish = false
authors = ["Tam1SH <ignatternyev54@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/uniproc-dev/amethystate"
description = "windows-reactor bindings for amethystate"
rust-version = "1.95.0"

[dependencies]
amethystate = "0.10.0"
amethystate-core = "0.10.0"
windows-reactor = "0.0.0"

[dev-dependencies]
windows-reactor = { version = "0.0.0", features = ["test"] }
amethystate = { version = "0.10.0", features = ["test-utils"] }

# windows-reactor is a placeholder on crates.io; point it at a windows-rs checkout.
[patch.crates-io]
windows-reactor = { path = "../../../../windows-rs/crates/libs/reactor" }
